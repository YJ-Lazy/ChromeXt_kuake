name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build debug
      run: ./gradlew app:assembleDebug

    - name: Build release
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: ./gradlew app:assembleRelease

    - name: Verify release Xposed entry point
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code \
          --class org.matrix.chromext.MainHook --method '<init>()V' \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Prepare APK files
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ChromeXt-unsigned.apk

    - name: Check signing configuration
      id: signing
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$SIGNING_KEY" ] && [ -n "$ALIAS" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Signing secrets are incomplete. The unsigned release APK will be uploaded instead."
        fi

    - name: Sign app APK
      id: sign_app
      if: ${{ steps.signing.outputs.configured == 'true' }}
      uses: noriban/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload debug build
      if: always() && steps.Prepare_APK_files.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ChromeXt_debug.apk
        path: app/build/ChromeXt_debug.apk

    - name: Upload signed APK
      if: ${{ steps.sign_app.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ChromeXt_signed.apk
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}

    - name: Upload unsigned release APK
      if: ${{ steps.signing.outputs.configured == 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: ChromeXt_unsigned.apk
        path: app/build/outputs/apk/release/ChromeXt-unsigned.apk
